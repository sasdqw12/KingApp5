name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git openjdk-17-jdk zip unzip zlib1g-dev libncurses5-dev libssl-dev libsqlite3-dev libffi-dev libbz2-dev
          java -version

      - name: Install build dependencies (fixed versions)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install Cython==0.29.37 buildozer==1.5.0 python-for-android==2024.01.21 virtualenv
          pip install kivy==2.3.0 kivymd==1.2.0 plyer pyjnius certifi

      - name: Build APK with buildozer
        run: |
          buildozer android debug
        env:
          ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
          ANDROIDNDK: /home/runner/.buildozer/android/platform/android-ndk-r25b
          ANDROIDAPI: 33
          ANDROIDMINAPI: 21

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 本地音频播放器APK
          path: bin/*.apk
          retention-days: 30
